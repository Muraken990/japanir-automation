name: Daily IR Image Post

on:
  # 月-金 20:00/20:30/21:00/21:30/22:00 JST に実行
  schedule:
    - cron: '0 11 * * 1-5'
    - cron: '30 11 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '0 13 * * 1-5'
  
  # 手動実行も可能
  workflow_dispatch:
    inputs:
      date:
        description: '日付（YYYYMMDD形式）'
        required: false
        default: ''
      rank:
        description: '投稿順位（1-5）'
        required: false
        default: '1'

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    
    steps:
      # ============================================================
      # ステップ1: リポジトリチェックアウト
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # ステップ2: Python環境セットアップ
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      # ============================================================
      # ステップ3: Chromiumインストール（Playwright用）
      # ============================================================
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
      
      # ============================================================
      # ステップ4: Python依存関係インストール
      # ============================================================
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests openai python-dateutil jinja2 playwright tweepy google-generativeai
          playwright install chromium
      
      # ============================================================
      # ステップ5: 日付設定
      # ============================================================
      - name: Set date
        id: date
        run: |
          if [ -z "${{ github.event.inputs.date }}" ]; then
            HOUR_JST=$(TZ=Asia/Tokyo date +%H)
            if [ "$HOUR_JST" -lt "09" ]; then
              # 深夜帯（0-8時JST）= GitHub Actionsの遅延で日付が変わった場合は前日を使う
              DATE=$(TZ=Asia/Tokyo date -d "yesterday" +%Y%m%d)
              echo "⚠️ 深夜帯実行 (${HOUR_JST}時JST) → 前日の日付を使用"
            else
              DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
            fi
          else
            # 手動実行の場合: 入力された日付
            DATE="${{ github.event.inputs.date }}"
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "📅 処理日付: $DATE"

      # ============================================================
      # ステップ6: 投稿順位設定
      # ============================================================
      - name: Set rank
        id: rank
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.rank }}" ]; then
            RANK="${{ github.event.inputs.rank }}"
          else
            case "${{ github.event.schedule }}" in
              "0 11 * * 1-5") RANK=1 ;;
              "30 11 * * 1-5") RANK=2 ;;
              "0 12 * * 1-5") RANK=3 ;;
              "30 12 * * 1-5") RANK=4 ;;
              "0 13 * * 1-5") RANK=5 ;;
              *) RANK=1 ;;
            esac
          fi

          if ! echo "$RANK" | grep -Eq '^[1-5]$'; then
            echo "❌ rank must be 1-5"
            exit 1
          fi

          echo "rank=$RANK" >> $GITHUB_OUTPUT
          echo "📌 投稿順位: $RANK"
      
      # ============================================================
      # ステップ7: 画像生成
      # ============================================================
      - name: Generate IR Image
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python 4_IR_ImageGenerator.py \
            --date ${{ steps.date.outputs.date }} \
            --time-start 08:00 \
            --time-end 20:00 \
            --rank ${{ steps.rank.outputs.rank }} \
            -s 2
          
          # 生成された画像を確認
          IMAGE_PATH="japan_ir_single_${{ steps.date.outputs.date }}_rank${{ steps.rank.outputs.rank }}.png"
          if [ -f "$IMAGE_PATH" ]; then
            echo "✅ 画像生成成功"
            echo "has_image=true" >> $GITHUB_OUTPUT
            ls -lh "$IMAGE_PATH"
          else
            echo "ℹ️ IR情報なし - 投稿スキップ"
            echo "has_image=false" >> $GITHUB_OUTPUT
          fi
          
      # ============================================================
      # ステップ8: X投稿
      # ============================================================
      - name: Post to X (Twitter)
        if: steps.generate.outputs.has_image == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python IR-JsonToX-Image.py \
            --date ${{ steps.date.outputs.date }} \
            --time-start 08:00 \
            --time-end 20:00 \
            --rank ${{ steps.rank.outputs.rank }} \
            --image-path japan_ir_single_${{ steps.date.outputs.date }}_rank${{ steps.rank.outputs.rank }}.png
      
      # ============================================================
      # ステップ9: エラー通知（失敗時のみ）
      # ============================================================
      - name: Send error notification
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "❌ ワークフロー失敗: ${{ steps.date.outputs.date }}"
          # Gmail通知は IR-JsonToX-Image.py 内で処理される
