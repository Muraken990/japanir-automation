<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --primary-light: #3B82F6;
            --accent: #06B6D4;
            --gray-100: #F1F5F9;
            --gray-200: #E2E8F0;
            --gray-500: #64748B;
            --gray-800: #1E293B;
            --gray-900: #0F172A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background: #E2E8F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 1200px;
            height: 1200px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 72px;
            position: relative;
        }

        /* Top bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 80px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--primary);
        }

        .date-label {
            font-size: 23px;
            font-weight: 500;
            color: var(--gray-500);
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ir-type-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: #ffffff;
            font-size: 23px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 100px;
            margin-bottom: 40px;
            width: fit-content;
        }

        .company-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .ticker {
            background: var(--gray-100);
            color: var(--primary);
            font-size: 27px;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 10px;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .company-name {
            font-size: 35px;
            font-weight: 700;
            color: var(--gray-500);
            line-height: 1.2;
        }

        .headline {
            font-size: 68px;
            font-weight: 800;
            color: var(--gray-900);
            line-height: 1.15;
            letter-spacing: -1.5px;
        }

        .headline .highlight {
            color: var(--primary);
        }

        /* Divider */
        .divider {
            width: 64px;
            height: 5px;
            background: var(--primary);
            border-radius: 3px;
            margin: 48px 0;
        }

        /* Footer */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 80px;
        }

        .footer-logo {
            font-size: 35px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .footer-logo span {
            color: var(--primary);
        }

        .footer-url {
            font-size: 27px;
            font-weight: 500;
            color: var(--gray-500);
        }
    </style>
</head>
<body>
    <div class="card tweet-card">
        <!-- Top -->
        <div class="top-bar">
            <div class="date-label">{{ date }} · {{ time }}</div>
        </div>

        <!-- Main -->
        <div class="main">
            <div class="ir-type-tag">{{ ir_type }}</div>

            <div class="company-row">
                <div class="ticker">{{ ticker }}</div>
                <div class="company-name">{{ company_name }}</div>
            </div>

            <div class="headline">
                {{ headline }}
            </div>

            <div class="divider"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-logo">Japan<span>IR</span></div>
            <div class="footer-url">japanir.jp/en</div>
        </div>
    </div>
</body>
</html>
